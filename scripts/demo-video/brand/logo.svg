<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Fly-Through logo: an aircraft on a dotted flight path through bands of fog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173A55"/>
      <stop offset="1" stop-color="#0B1426"/>
    </linearGradient>
    <clipPath id="tile"><rect x="4" y="4" width="152" height="152" rx="38"/></clipPath>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="38" fill="url(#bg)"/>
  <g clip-path="url(#tile)" fill="none" stroke-linecap="round">
    <!-- fog bands -->
    <path d="M-6 84 q 20 -9 40 0 t 40 0 t 40 0 t 40 0 t 40 0" stroke="#EEF2F7" stroke-opacity="0.22" stroke-width="8"/>
    <path d="M-26 104 q 20 -9 40 0 t 40 0 t 40 0 t 40 0 t 40 0" stroke="#EEF2F7" stroke-opacity="0.42" stroke-width="8"/>
    <path d="M-6 124 q 20 -9 40 0 t 40 0 t 40 0 t 40 0 t 40 0" stroke="#EEF2F7" stroke-opacity="0.22" stroke-width="8"/>
    <!-- the flight path, cutting through the fog -->
    <path d="M22 140 C 52 128, 78 92, 108 58" stroke="#2EC4B6" stroke-width="5" stroke-dasharray="1 11"/>
  </g>
  <!-- the aircraft, heading out of the fog -->
  <g transform="translate(116 48) rotate(41) scale(1.25)">
    <path d="M0,-30 C4,-30 5,-24 5,-18 L5,-6 L30,6 L30,11 L5,5 L5,18 L13,25 L13,29 L0,26 L-13,29 L-13,25 L-5,18 L-5,5 L-30,11 L-30,6 L-5,-6 L-5,-18 C-5,-24 -4,-30 0,-30 Z" fill="#D9B26F"/>
  </g>
  <rect x="4" y="4" width="152" height="152" rx="38" fill="none" stroke="#2EC4B6" stroke-opacity="0.55" stroke-width="2"/>
</svg>
